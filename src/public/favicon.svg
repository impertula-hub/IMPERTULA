<svg width="32" height="32" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified IMPERTULA logo for favicon -->
  <rect width="640" height="640" fill="white"/>
  
  <!-- Water drops -->
  <ellipse cx="500" cy="120" rx="30" ry="40" fill="#0066CC"/>
  <ellipse cx="430" cy="90" rx="25" ry="35" fill="#0066CC"/>
  <ellipse cx="550" cy="90" rx="25" ry="35" fill="#0066CC"/>
  
  <!-- Building -->
  <rect x="80" y="250" width="150" height="200" fill="#0066CC"/>
  <rect x="100" y="270" width="20" height="30" fill="white"/>
  <rect x="140" y="270" width="20" height="30" fill="white"/>
  <rect x="100" y="320" width="20" height="30" fill="white"/>
  <rect x="140" y="320" width="20" height="30" fill="white"/>
  <rect x="100" y="370" width="20" height="30" fill="white"/>
  <rect x="140" y="370" width="20" height="30" fill="white"/>
  
  <!-- House -->
  <polygon points="250,380 320,320 390,380" fill="#CC3333"/>
  <rect x="250" y="380" width="140" height="120" fill="#0066CC"/>
  <rect x="285" y="420" width="30" height="40" fill="white"/>
  <rect x="335" y="420" width="30" height="40" fill="white"/>
  
  <!-- Fester logo simplified -->
  <ellipse cx="320" cy="550" rx="60" ry="15" fill="#CC3333"/>
  <text x="320" y="560" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">FESTER</text>
</svg>
